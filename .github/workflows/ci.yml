name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest --cov --cov-report=term-missing
      - run: uv build

  publiccode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: italia/publiccode-parser-action@v1
        with:
          publiccode: publiccode.yml
          no-network: true

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python -m benchmarks.run --check
      - run: uv run python -m benchmarks.faithful --check

  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --group examples
      - name: The notebooks are the examples
        run: uv run --group examples python tools/make_notebooks.py --check
      - name: Every notebook runs
        working-directory: notebooks
        run: uv run --group examples jupyter nbconvert --to notebook --execute --output-dir /tmp/run *.ipynb

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run --with mypy mypy --strict src tests

