[project]
name = "fwi-chain"
version = "1.2.0"
description = "Canadian Fire Weather Index chain (Van Wagner 1987): pure, typed, zero-dependency, verified against the reference day"
readme = "README.md"
keywords = ["fire weather index", "fwi", "wildfire", "van wagner", "cffdrs", "ffmc", "drought code"]
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Giuseppe Zileni", email = "giuseppe.zileni@gmail.com" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# The MCP server (fwi-chain-mcp). The package itself needs nothing.
mcp = ["mcp>=2.3"]

[project.scripts]
fwi-chain-mcp = "fwi_chain.mcp_server:main"

[project.urls]
Homepage = "https://github.com/agent-engineering-studio/fwi-chain"
Issues = "https://github.com/agent-engineering-studio/fwi-chain/issues"
Changelog = "https://github.com/agent-engineering-studio/fwi-chain/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mcp>=2.3",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

docs = [
    "mkdocstrings[python]>=0.26",
    "zensical>=0.1.0",
]

# The example notebooks (make notebooks, and the Docker image).
examples = [
    "jupyterlab>=4.2",
    "nbconvert>=7.16",
    "matplotlib>=3.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# The notebooks are written by tools/make_notebooks.py: formatting them here
# would make them differ from what it writes.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ARG", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "B018"]
# Stubs standing in for Limen's repositories keep the signatures they replace.
"scripts/**" = ["ARG"]
# The docstrings mirror Van Wagner's equations (×, ·, −, °): the math is the point.
"src/fwi_chain/chain.py" = ["RUF002", "RUF003"]
"tests/**.py" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["fwi_chain"]

[tool.coverage.report]
fail_under = 90
show_missing = true
