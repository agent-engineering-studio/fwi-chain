# Known cases for fwi-chain, with the answer we expect and where it comes from.
#
#   kind = "against-cffdrs"   the chain walked over a series, against what the
#                             cffdrs R package gives for the same days.
#                             `tolerance`: the largest difference allowed, per code.
#   kind = "day"              one day from a state: the codes we expect.
#   kind = "rain-threshold"   rain at `at_mm` leaves `code` as a dry day does;
#                             rain at `above_mm` lowers it.
#   kind = "stale-start"      a stored state `age_days` old, limit `max_gap_days`:
#                             is it discarded by catch_up()?
#
# status = "published": the expected numbers are someone else's, cited in `source`.
# status = "by-hand":   the expected number can be worked out on paper from the
#                       equation cited.
# status = "pinned":    the expected numbers are this library's own, kept so a
#                       change in them is seen. They prove nothing by themselves.

# --- 48 days of the cffdrs test series -----------------------------------------
# The tolerances are not zero, and that is the finding. cffdrs follows the
# FORTRAN program of Van Wagner & Pickett (1985): 147.27723 in the FFMC scale
# where the 1987 report (Eq. 1) prints 147.2, and 0.023 where Eq. 12 has
# 1/43.43. This library follows the report. See benchmarks/README.md.

[[case]]
id = "cffdrs-48-days"
title = "The test series of cffdrs, 13 April to 30 May 1985, from the standard codes"
status = "published"
kind = "against-cffdrs"
inputs = "cffdrs/test_fwi.csv"
expected = "cffdrs/fwi_01.csv"
source = "cffdrs 1.10.0 (cffdrs_r at 4d20a303bf): data/test_fwi.csv and tests/testthat/data/fwi_01.csv, the output of fwi(test_fwi)"
tolerance = { ffmc = 0.15, dmc = 0.10, dc = 0.01, isi = 0.30, bui = 0.10, fwi = 0.30 }

# --- single days ---------------------------------------------------------------

[[case]]
id = "first-day-by-hand"
title = "The drought code of 13 April 1985, worked on paper"
status = "by-hand"
kind = "day"
source = "Van Wagner (1987) Eq. 22-23: DC = 15 + (0.36 * (17 + 2.8) + 0.9) / 2 = 19.014"
state = { ffmc = 85.0, dmc = 6.0, dc = 15.0 }
month = 4
reading = { temperature_c = 17.0, relative_humidity_pct = 42.0, wind_speed_kmh = 25.0, rain_24h_mm = 0.0 }
expect = { dc = 19.014 }
tolerance = 1e-9

[[case]]
id = "first-day-pinned"
title = "The six codes of 13 April 1985, as this library computes them"
status = "pinned"
kind = "day"
source = "fwi-chain 1.0.0. cffdrs gives FFMC 87.65, ISI 10.78, FWI 10.04 for the same day: see cffdrs-48-days"
state = { ffmc = 85.0, dmc = 6.0, dc = 15.0 }
month = 4
reading = { temperature_c = 17.0, relative_humidity_pct = 42.0, wind_speed_kmh = 25.0, rain_24h_mm = 0.0 }
expect = { ffmc = 87.692980092774, dmc = 8.5450511359998, dc = 19.013999999999996, isi = 10.853661073312, bui = 8.4904265358371, fwi = 10.096371392382 }
tolerance = 1e-9

# --- the rain each code ignores --------------------------------------------------

[[case]]
id = "ffmc-ignores-half-a-millimetre"
title = "Rain up to 0.5 mm is caught by the canopy and does not wet the fine fuel"
status = "published"
kind = "rain-threshold"
source = "Van Wagner (1987) Eq. 2"
code = "ffmc"
at_mm = 0.5
above_mm = 0.6

[[case]]
id = "dmc-ignores-1.5-mm"
title = "Rain up to 1.5 mm does not reach the duff"
status = "published"
kind = "rain-threshold"
source = "Van Wagner (1987) Eq. 11"
code = "dmc"
at_mm = 1.5
above_mm = 1.6

[[case]]
id = "dc-ignores-2.8-mm"
title = "Rain up to 2.8 mm does not reach the deep layer"
status = "published"
kind = "rain-threshold"
source = "Van Wagner (1987) Eq. 18"
code = "dc"
at_mm = 2.8
above_mm = 2.9

# --- a stored state too old ------------------------------------------------------
# Limen's daily update carried a stored state up to twice the limit (found
# moving the walk here, 2026-11-28; judged a bug by its author). catch_up()
# discards it at the limit.

[[case]]
id = "stale-at-the-limit"
title = "A state exactly as old as the limit is carried on"
status = "by-hand"
kind = "stale-start"
source = "The rule of the backfill: discard when the gap is longer than max_gap_days"
age_days = 7
max_gap_days = 7
discarded = false

[[case]]
id = "stale-one-day-past"
title = "A state one day past the limit is discarded"
status = "by-hand"
kind = "stale-start"
source = "The rule of the backfill"
age_days = 8
max_gap_days = 7
discarded = true

[[case]]
id = "stale-between-one-and-two-limits"
title = "A state ten days old with a limit of seven is discarded"
status = "by-hand"
kind = "stale-start"
source = "The case the trimmed window let through: days_to_walk() then walk_chain() keeps it"
age_days = 10
max_gap_days = 7
discarded = true
