site_name: fwi-chain
site_description: The Canadian Fire Weather Index chain (Van Wagner 1987), pure Python, verified against the published reference to 1e-9
site_url: https://agentengineering.it/fwi-chain/
repo_url: https://github.com/agent-engineering-studio/fwi-chain
repo_name: agent-engineering-studio/fwi-chain
edit_uri: edit/main/docs/
copyright: Code Apache-2.0.

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      toggle: {icon: material/weather-sunny, name: Light mode}

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            show_source: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets: {base_path: ["."], check_paths: true}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# docs/README.md is the map of these pages for GitHub browsing; on the site the
# navigation below does that job.
exclude_docs: |
  README.md
  scripts/

nav:
  - Home: index.md
  - Guide:
      - How the FWI works: how-fwi-works.md
      - Getting started: getting-started.md
      - Cookbook: cookbook.md
      - FAQ: faq.md
  - Reference:
      - API reference: api.md
      - Reference (generated): reference.md
      - Validation: validation.md
  - Social media kit: social-kit.md
  - Changelog: changelog.md
  - Contributing: contributing.md

# The README is written for GitHub: its relative links (LICENSE) point at the
# repository, not at the site.
validation:
  links:
    not_found: info
    unrecognized_links: info
